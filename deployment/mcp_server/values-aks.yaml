namespace: mcp-server


deployment:
  name: mcp-server
  replicas: 1

  labels:
    appName: mcp-server

  container:
    name: mcp-server

    image:
      name: baoduy3/mcp_server_rag
      version: v-final-2
      imagePullPolicy: IfNotPresent

    environment:
      LOG_LEVEL: "INFO"

      PORT: "8002"
      PROMETHEUS_PORT: "9102"

      QDRANT_HOST: >-
        qdrant.qdrant-vdb.svc.cluster.local

      QDRANT_PORT: "6333"
      QDRANT_TIMEOUT_SEC: "30"

      QDRANT_COLLECTION: "dmv_handbook_v4"

      DENSE_VECTOR_NAME: ""
      SPARSE_VECTOR_NAME: ""

      EMBEDDING_MODEL_PATH: >-
        /app/models/gte-modernbert-base

      EMBEDDING_ONNX_FILE: >-
        onnx/model_int8.onnx

      EMBEDDING_BATCH_SIZE: "4"
      EMBEDDING_MAX_LENGTH: "512"

      RERANK_MODEL_PATH: >-
        /app/models/gte-reranker-modernbert-base

      RERANK_ONNX_FILE: >-
        onnx/model_quantized.onnx

      RERANK_BATCH_SIZE: "2"
      RERANK_MAX_LENGTH: "512"

      MAX_RERANK_PAIRS: "12"

      TOKENIZERS_PARALLELISM: "false"

      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"

    resources:
      requests:
        memory: 4Gi
        cpu: "1"

      limits:
        memory: 8Gi
        cpu: "4"


service:
  name: mcp-server-service
  type: ClusterIP

  ports:
    mcp:
      port: 8002
      targetPort: 8002

    metrics:
      port: 9102
      targetPort: 9102


monitoring:
  enabled: true
  namespace: observability
  releaseName: kps
  interval: 15s
  scrapeTimeout: 10s