mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

    otlp/local:
      protocols:
        grpc:
          endpoint: 127.0.0.1:4317
        http:
          endpoint: 127.0.0.1:4318

  processors:
    batch: {}

  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers:
          - otlp
          - otlp/local
        processors:
          - batch
        exporters:
          - otlp/tempo

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318