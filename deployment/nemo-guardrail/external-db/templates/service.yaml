apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.namespace }}  
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.deployment.labels.appName }} 
  ports:
    - protocol: TCP
      port: {{ .Values.service.ports.port }} 
      targetPort: {{ .Values.service.ports.targetPort }} 